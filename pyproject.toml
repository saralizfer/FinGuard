[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard"
version = "0.1.0"
description = "Educational financial resilience simulator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
app = ["streamlit>=1.66,<2", "pandas>=2.2,<4", "plotly>=6,<7"]

[tool.setuptools.packages.find]
include = ["finguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
